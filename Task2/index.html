.check small{display:block;color:var(--muted)}

.case{display:grid;gap:8px;align-content:start}
.case .yr{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.case .lesson{border-top:1px solid var(--line);padding-top:8px;font-size:.9rem}

.qh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.q-prompt{font-family:var(--f-head);font-size:1.2rem;font-weight:600;line-height:1.3}

.opt{text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:12px 14px}
.opt:hover:not(:disabled){border-color:var(--accent)}

.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}

.expl{margin-top:14px;padding:12px 14px;background:var(--code);border-radius:8px;font-size:.92rem}
.score{display:grid;gap:12px}

.pip{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}

.pip.ok{background:var(--good);border-color:var(--good);color:var(--bg)}
.rules{display:grid;gap:6px;padding-left:18px;margin:0;color:var(--muted);font-size:.92rem}

s_title:"Recognize a fake website",
s_p:"Only one part of a web address tells you who owns the site: the <b>registered domain</b>, the name just before the final ending (.com, .tg, .org). Everything to its left is chosen by whoever owns that domain, and everything after the first single slash is just a page on that site.",

s_note:"Training addresses here end in .example, a reserved ending that never resolves, so none of these are real sites. In real life the same patterns appear with .com, .net and country endings. A padlock or https only means the connection is encrypted. Attackers get certificates too, so it does not prove the site is genuine.",

h_lede:"Le phishing (ou hameçonnage) est un message conçu pour vous faire livrer un mot de passe, un paiement ou un clic. Cette formation montre comment reconnaître les faux e-mails et faux sites, comment les attaquants manipulent leurs cibles, et quoi faire dès que quelque chose vous semble anormal.",

i_title:"Ce qu'est le phishing, et ses formes",
i_p:"L'attaquant se fait passer pour quelqu'un de confiance (une banque, un responsable, un transporteur, le support informatique) et demande quelque chose d'apparemment banal : confirmer un compte, valider un paiement, ouvrir un fichier. Le but est généralement de voler des identifiants ou de l'argent, ou d'installer un logiciel malveillant. Le message change, la structure reste la même : <b>un expéditeur crédible, une raison de se presser, et un lien, un numéro ou un fichier sur lequel agir.</b>",

e_scan_h:"Le contrôle rapide, dans l'ordre",
e_scan_p:"1) Qui l'a vraiment envoyé ? Lisez l'adresse complète, pas le nom affiché. 2) Que me demande-t-on, et avec quelle urgence ? 3) Où mène le lien ? Survolez-le ou appuyez longuement pour voir la vraie destination. 4) Est-ce conforme à la façon dont cet organisme me contacte d'habitude ? Au moindre doute, ne cliquez pas. Ouvrez l'application officielle ou saisissez vous-même l'adresse.",
s_title:"Reconnaître un faux site web",
s_p:"Une seule partie d'une adresse web indique à qui appartient le site : le <b>domaine enregistré</b>, c'est-à-dire le nom juste avant la terminaison finale (.com, .tg, .org). Tout ce qui se trouve à sa gauche est choisi par le propriétaire du domaine, et tout ce qui suit le premier « / » n'est qu'une page de ce site.",
s_l1:"Protocole",s_l2:"Sous-domaine (créé librement par le propriétaire du domaine)",s_l3:"Domaine enregistré : le propriétaire",s_l4:"Chemin de la page",
s_note:"Dans cette formation, les adresses se terminent par .example, une terminaison réservée qui ne mène nulle part : aucun de ces sites n'est réel. Dans la vraie vie, les mêmes schémas apparaissent avec .com, .net ou des terminaisons de pays. Un cadenas ou « https » indique seulement que la connexion est chiffrée. Les attaquants obtiennent aussi des certificats : cela ne prouve pas que le site est authentique.",
s_prac:"Entraînement : vrai ou faux ?",s_prac_p:"Le vrai domaine de la banque est",s_real:"Vrai",s_fake:"Faux",s_ok:"Exact. ",s_no:"Pas tout à fait. ",s_pass:"Module validé. Il compte désormais dans votre progression.",s_fail:"Il faut au moins 4 sur 6 pour valider ce module et le compter dans votre progression. Relisez les explications, puis réessayez.",s_retry:"Réessayer",
s_other_h:"Autres signes qu'une page est une copie",
s_other_p:"Vous êtes arrivé par un message plutôt que par votre propre favori. La page demande plus que d'habitude (code PIN de carte, mot de passe complet et code à usage unique ensemble). Petits défauts de mise en page, d'orthographe ou de logo. La zone de connexion s'affiche dans une fenêtre pop-up. La barre d'adresse affiche un domaine inconnu, même si la page est parfaite.",
t_title:"Ingénierie sociale : comment les attaquants manipulent leurs cibles",

Q("Your phone shows three login approval prompts you did not trigger. Shortly after, someone on chat says they are from IT and asks you to accept one. What do you do?","Votre téléphone affiche trois demandes d'approbation de connexion que vous n'avez pas déclenchées. Peu après, quelqu'un se disant du support informatique vous demande d'en accepter une. Que faites-vous ?",

Q("A caller says they are from your bank's fraud team and asks you to read out the six-digit code you just received by SMS. You should:","Un appelant se dit de l'équipe antifraude de votre banque et vous demande de lire le code à six chiffres reçu par SMS. Vous devez :",

Q("A colleague emails 'Salary review 2026.xlsx, confidential, open quickly'. You were not expecting it. What do you do?","Un collègue vous écrit « Revue des salaires 2026.xlsx, confidentiel, ouvrez vite ». Vous ne l'attendiez pas. Que faites-vous ?",

/* Emails */
Q("Which part of an email address shows who really sent it?","Quelle partie d'une adresse e-mail montre qui l'a réellement envoyé ?",["The display name|Le nom affiché","The domain after the @|Le domaine après le @","The subject line|L'objet","The signature|La signature"],1,"The display name is free text anyone can set. The domain after the @ is the better clue, though it can still be spoofed, so combine it with other checks.","Le nom affiché est un texte libre que chacun peut régler. Le domaine après le @ est un meilleur indice, bien qu'il puisse aussi être falsifié : combinez-le avec d'autres vérifications."),
Q("An email greets you by your correct name and mentions your real manager. Does that prove it is genuine?","Un e-mail vous salue par votre vrai nom et cite votre vrai responsable. Cela prouve-t-il qu'il est authentique ?",["Yes, only insiders know that|Oui, seuls les initiés le savent","No, attackers collect names and roles from public profiles|Non, les attaquants collectent noms et rôles sur des profils publics","Yes, if it has a company logo|Oui, s'il a le logo de l'entreprise","Only if sent during work hours|Seulement s'il est envoyé aux heures de bureau"],1,"Names, titles and reporting lines are often public or leaked. Personal details make a message convincing, not trustworthy.","Noms, fonctions et lignes hiérarchiques sont souvent publics ou ont fuité. Des détails personnels rendent un message convaincant, pas fiable."),
Q("Which request in an email should always trigger extra verification?","Quelle demande dans un e-mail doit toujours déclencher une vérification supplémentaire ?",["A newsletter you subscribed to|Une newsletter à laquelle vous êtes abonné","A change of bank details on an invoice|Un changement de coordonnées bancaires sur une facture","A meeting invite already in your calendar|Une invitation à une réunion déjà dans votre agenda","An automatic out-of-office reply|Une réponse d'absence automatique"],1,"Changed payment details are the core of invoice fraud. Confirm them by phone on a number you already hold.","Un changement de coordonnées de paiement est au cœur de la fraude à la facture. Confirmez-le par téléphone sur un numéro que vous possédez déjà."),
Q("The Reply-To address of an email differs from its From address. What does this suggest?","L'adresse de réponse (Reply-To) d'un e-mail diffère de l'adresse d'expéditeur. Que cela suggère-t-il ?",["Nothing, it is never worth checking|Rien, cela ne vaut jamais la peine d'être vérifié","Replies may go to someone other than the apparent sender, so look closer|Les réponses peuvent aller à quelqu'un d'autre que l'expéditeur apparent : regardez de plus près","The email is encrypted|L'e-mail est chiffré","The email was sent twice|L'e-mail a été envoyé deux fois"],1,"Legitimate tools sometimes do this, but it is a classic way to redirect replies to an attacker. Treat it as a reason to verify.","Des outils légitimes le font parfois, mais c'est une méthode classique pour rediriger les réponses vers un attaquant. C'est une raison de vérifier."),
Q("A message says 'Your parcel is held. Pay a 500 FCFA customs fee' with a link. What is the first step?","Un message dit : « Votre colis est bloqué. Payez 500 FCFA de frais de douane » avec un lien. Quelle est la première étape ?",["Pay it, the amount is small|Payer, le montant est faible","Check the tracking on the carrier's official site or app, not through the link|Vérifier le suivi sur le site ou l'appli officiels du transporteur, pas via le lien","Reply STOP|Répondre STOP","Forward it to friends|Le transférer à des amis"],1,"Small amounts lower your guard, and the real goal is your card or mobile-money details. Use the official tracking instead.","Les petits montants baissent la garde, et le vrai but est vos données de carte ou de mobile money. Utilisez plutôt le suivi officiel."),
Q("Which attachment is the riskiest from an unknown sender?","Quelle pièce jointe est la plus risquée venant d'un inconnu ?",["A plain text note|Une note en texte brut","An .html or .zip file you are told to open|Un fichier .html ou .zip qu'on vous demande d'ouvrir","A small signature image|Une petite image de signature","A calendar reminder|Un rappel d'agenda"],1,"HTML pages and archives can hide fake login pages or malware. Any unexpected attachment deserves caution.","Les pages HTML et les archives peuvent cacher de fausses pages de connexion ou des logiciels malveillants. Toute pièce jointe inattendue appelle à la prudence."),
Q("You receive a password-reset email you did not request. What is the best action?","Vous recevez un e-mail de réinitialisation de mot de passe que vous n'avez pas demandé. Quelle est la meilleure action ?",["Click the link to cancel it|Cliquer sur le lien pour l'annuler","Do not use the link; check your account directly for unusual activity|Ne pas utiliser le lien ; vérifier directement votre compte à la recherche d'activité inhabituelle","Reply with your old password|Répondre avec votre ancien mot de passe","Forward it to the address inside it|Le transférer à l'adresse indiquée dedans"],1,"The email may be a trap, or a real sign someone is trying your account. Go to the official site yourself and review recent activity.","L'e-mail peut être un piège, ou le signe réel que quelqu'un essaie votre compte. Allez vous-même sur le site officiel et examinez l'activité récente."),
Q("Which statement about spotting phishing is true?","Quelle affirmation sur la détection du phishing est vraie ?",["A perfectly written email must be safe|Un e-mail parfaitement rédigé est forcément sûr","Typos are the only sign to watch for|Les fautes sont le seul signe à surveiller","No single sign is enough, so check sender, link and request together|Aucun signe isolé ne suffit : vérifiez ensemble l'expéditeur, le lien et la demande","Emails with logos are safe|Les e-mails avec logo sont sûrs"],2,"Polished writing and logos are easy to copy. Combine several checks rather than relying on one clue.","Une rédaction soignée et des logos se copient facilement. Combinez plusieurs vérifications au lieu de vous fier à un seul indice."),

Q("In https://account.verify-meridian.example/login, which part is the registered domain?","Dans https://account.verify-meridian.example/login, quelle partie est le domaine enregistré ?",["account|account","verify-meridian.example|verify-meridian.example","meridian|meridian","https|https"],1,"The registered domain is the name before the final ending, here verify-meridian.example. 'account.' is just a subdomain.","Le domaine enregistré est le nom avant la terminaison finale, ici verify-meridian.example. « account. » n'est qu'un sous-domaine."),
Q("What is the safest way to reach your bank online?","Quelle est la façon la plus sûre d'accéder à votre banque en ligne ?",["Click the link in an SMS|Cliquer sur le lien d'un SMS","Click a search ad at the top of the results|Cliquer sur une annonce en tête des résultats","Use the official app or your own bookmark|Utiliser l'application officielle ou votre propre favori","Open a link a colleague forwarded|Ouvrir un lien transféré par un collègue"],2,"Attackers buy ads and send links. Your own bookmark or the official app skips that risk.","Les attaquants achètent des annonces et envoient des liens. Votre favori ou l'appli officielle évite ce risque."),
Q("What does the padlock icon in the browser guarantee?","Que garantit le cadenas dans le navigateur ?",["The site belongs to your bank|Le site appartient à votre banque","The connection is encrypted, not that the site is honest|La connexion est chiffrée, pas que le site est honnête","The site has no malware|Le site ne contient aucun logiciel malveillant","The link came from a safe sender|Le lien vient d'un expéditeur sûr"],1,"Encryption protects data in transit, even to a criminal's site. Always check the domain itself.","Le chiffrement protège les données en transit, même vers le site d'un criminel. Vérifiez toujours le domaine lui-même."),
Q("Real domain: northwind-pay.example. Which address uses a look-alike character trick?","Domaine réel : northwind-pay.example. Quelle adresse utilise des caractères qui se ressemblent ?",["northwind-pay.example|northwind-pay.example","northvvind-pay.example|northvvind-pay.example","pay.northwind-pay.example|pay.northwind-pay.example","www.northwind-pay.example|www.northwind-pay.example"],1,"'vv' imitates 'w'. Slow down and read letter by letter, or use a bookmark.","« vv » imite « w ». Ralentissez et lisez lettre par lettre, ou utilisez un favori."),
Q("A login window pops up inside another website asking for your account password. What should you do?","Une fenêtre de connexion s'affiche à l'intérieur d'un autre site et demande votre mot de passe. Que faire ?",["Enter it, the pop-up looks official|La saisir, la fenêtre a l'air officielle","Close it and sign in from the official site or app directly|La fermer et vous connecter directement depuis le site ou l'appli officiels","Enter a fake password first|Saisir d'abord un faux mot de passe","Take a screenshot and share it|Faire une capture d'écran et la partager"],1,"Pop-ups can imitate real login windows perfectly. Sign in only from a page you opened yourself.","Les pop-ups peuvent imiter parfaitement de vraies fenêtres de connexion. Ne vous connectez que depuis une page ouverte par vous-même."),
Q("Your password manager does not offer to fill in a login on a site that looks like your bank. What does this suggest?","Votre gestionnaire de mots de passe ne propose pas de remplir la connexion sur un site qui ressemble à votre banque. Que cela suggère-t-il ?",["The manager is broken|Le gestionnaire est en panne","The domain may not match the saved one, so be suspicious|Le domaine ne correspond peut-être pas à celui enregistré : méfiance","Your password is too long|Votre mot de passe est trop long","The site is faster than usual|Le site est plus rapide que d'habitude"],1,"Managers match the exact domain. No autofill on a familiar-looking page is a free warning.","Les gestionnaires vérifient le domaine exact. L'absence de remplissage sur une page familière est une alerte gratuite."),
Q("A shortened link arrives in an unexpected message. What is a safe approach?","Un lien raccourci arrive dans un message inattendu. Quelle approche est sûre ?",["Click, then check the page|Cliquer, puis vérifier la page","Use a link-preview tool, or skip the link and go to the official site|Utiliser un outil d'aperçu du lien, ou l'ignorer et aller sur le site officiel","Share it to ask friends|Le partager pour demander à des amis","Open it on another device|L'ouvrir sur un autre appareil"],1,"Short links hide the destination. Preview them, or never use them to log in or pay.","Les liens courts cachent la destination. Prévisualisez-les, ou ne les utilisez jamais pour vous connecter ou payer."),

Q("A caller says your SIM will be blocked unless you confirm your PIN. What is this?","Un appelant dit que votre SIM sera bloquée si vous ne confirmez pas votre PIN. De quoi s'agit-il ?",["A routine operator check|Un contrôle opérateur de routine","Vishing, a phone-based phishing attempt|Du vishing, une tentative d'hameçonnage par téléphone","A software update|Une mise à jour logicielle","A lottery|Une loterie"],1,"Operators do not ask for your PIN. End the call and contact them through the official number.","Les opérateurs ne demandent pas votre PIN. Raccrochez et contactez-les via le numéro officiel."),
Q("An SMS says a mobile-money transfer was received and asks you to call a number to 'confirm'. Best action?","Un SMS indique qu'un transfert mobile money a été reçu et demande d'appeler un numéro pour « confirmer ». Meilleure action ?",["Call to confirm|Appeler pour confirmer","Check your balance and history in the official app or USSD menu|Vérifier votre solde et votre historique dans l'appli officielle ou le menu USSD","Send a small test amount|Envoyer un petit montant test","Reply with your ID number|Répondre avec votre numéro de pièce d'identité"],1,"Fake credit alerts are common. Only the official channel shows what really arrived.","Les fausses alertes de crédit sont courantes. Seul le canal officiel montre ce qui est réellement arrivé."),
Q("A caller from 'bank fraud' says they already see the attacker. Which move is safest?","Un appelant du « service fraude de la banque » dit qu'il voit déjà l'attaquant. Quelle réaction est la plus sûre ?",["Stay on the line and follow their steps|Rester en ligne et suivre leurs consignes","Hang up and call the number on your card or the official site|Raccrocher et appeler le numéro de votre carte ou du site officiel","Ask them to name your last transaction as proof|Leur demander de citer votre dernière transaction comme preuve","Move money to the 'safe account' they give|Transférer l'argent vers le « compte sûr » qu'ils donnent"],1,"Callers may know some of your details. Never move money to a 'safe account'; call back on an official number.","Les appelants peuvent connaître certains de vos détails. Ne transférez jamais d'argent vers un « compte sûr » ; rappelez sur un numéro officiel."),
Q("Which text is typical of smishing?","Quel texte est typique du smishing ?",["'Your verification code is 482913. Do not share it.' (you just requested one)|« Votre code de vérification est 482913. Ne le partagez pas. » (vous venez d'en demander un)","'Your account is locked. Restore access now: bit.example/x7'|« Votre compte est bloqué. Rétablissez l'accès maintenant : bit.example/x7 »","'Meeting moved to 3 pm'|« Réunion déplacée à 15 h »","'Happy birthday!'|« Joyeux anniversaire ! »"],1,"A lock notice with a short link and a rush to act is the classic pattern.","Un avis de blocage avec un lien court et une pression pour agir est le schéma classique."),
Q("A caller from 'IT support' asks you to install a remote-control app to fix a problem. You never contacted IT. What do you do?","Un appelant du « support informatique » vous demande d'installer une appli de contrôle à distance. Vous n'avez jamais contacté l'informatique. Que faites-vous ?",["Install it, they sound professional|L'installer, ils semblent professionnels","Decline, hang up, and contact IT through the official channel|Refuser, raccrocher et contacter l'informatique par le canal officiel","Install it but withhold your password|L'installer mais ne pas donner votre mot de passe","Ask them to call back later, then comply|Leur demander de rappeler plus tard, puis obéir"],1,"Remote-control tools give full access to your device. Only use them with support you contacted yourself.","Les outils de contrôle à distance donnent un accès complet à votre appareil. Ne les utilisez qu'avec un support que vous avez contacté vous-même."),
Q("Why is caller ID not proof of who is calling?","Pourquoi l'affichage du numéro n'est-il pas une preuve de l'identité de l'appelant ?",["It is always accurate|Il est toujours exact","Numbers can be spoofed to show a trusted name|Les numéros peuvent être falsifiés pour afficher un nom de confiance","It only works on landlines|Il ne marche que sur les fixes","It is encrypted|Il est chiffré"],1,"Spoofing tools can show any number. Call back through a number you look up yourself.","Des outils de falsification peuvent afficher n'importe quel numéro. Rappelez via un numéro que vous trouvez vous-même."),
Q("A WhatsApp message from an unknown number says: 'Hi Mum, this is my new number, I urgently need money.' Best action?","Un message WhatsApp d'un numéro inconnu dit : « Coucou maman, c'est mon nouveau numéro, j'ai besoin d'argent d'urgence. » Meilleure action ?",["Send the money, it is family|Envoyer l'argent, c'est la famille","Call your child on the number you already have before doing anything|Appeler votre enfant sur le numéro que vous avez déjà avant toute chose","Ask for their bank details and pay|Demander ses coordonnées bancaires et payer","Block your real family members|Bloquer vos vrais proches"],1,"Family impersonation relies on panic. A call to the known number settles it in a minute.","L'usurpation de proche repose sur la panique. Un appel au numéro connu règle la question en une minute."),
/* Social engineering */
Q("What is pretexting?","Qu'est-ce que le pretexting (prétexte) ?",["Sending bulk spam|Envoyer du spam en masse","Inventing a believable scenario to gain trust and information|Inventer un scénario crédible pour gagner la confiance et obtenir des informations","Encrypting files for ransom|Chiffrer des fichiers contre rançon","Guessing passwords by trial|Deviner des mots de passe par essais"],1,"The pretext is the story: an auditor, a new hire, a supplier. It makes the request seem normal.","Le prétexte est l'histoire : un auditeur, un nouvel embauché, un fournisseur. Il rend la demande normale."),
Q("A stranger in the lobby asks you to hold the door because they 'forgot their badge'. What is this technique called?","Un inconnu dans le hall vous demande de tenir la porte car il a « oublié son badge ». Comment appelle-t-on cette technique ?",["Tailgating, a physical social engineering technique|Le tailgating, une technique d'ingénierie sociale physique","Smishing|Le smishing","Spoofing|Le spoofing","Ransomware|Le rançongiciel"],0,"Social engineering is not only online. Politely direct the person to reception.","L'ingénierie sociale n'est pas que numérique. Orientez poliment la personne vers l'accueil."),
Q("Which feeling do attackers often trigger so you act without checking?","Quelle émotion les attaquants déclenchent-ils souvent pour que vous agissiez sans vérifier ?",["Calm|Le calme","Urgency or fear|L'urgence ou la peur","Boredom|L'ennui","Sleepiness|La somnolence"],1,"Strong emotions cut thinking time. If a message rushes you, that is the moment to pause.","Les émotions fortes réduisent le temps de réflexion. Si un message vous presse, c'est le moment de faire une pause."),
Q("A USB drive labeled 'Salaries 2026' is left in the car park. What is the right action?","Une clé USB étiquetée « Salaires 2026 » traîne sur le parking. Quelle est la bonne action ?",["Plug it in to find the owner|La brancher pour trouver son propriétaire","Hand it to IT or security without plugging it in|La remettre à l'informatique ou à la sécurité sans la brancher","Take it home|L'emporter chez vous","Plug it into a spare laptop|La brancher sur un ordinateur de rechange"],1,"This is baiting: curiosity is the hook. Unknown drives can run malware as soon as they are plugged in.","C'est de l'appât (baiting) : la curiosité est l'hameçon. Une clé inconnue peut exécuter un logiciel malveillant dès qu'elle est branchée."),
Q("'Everyone else on your team has already completed this verification.' Which persuasion principle is this?","« Tous les autres de votre équipe ont déjà fait cette vérification. » Quel principe de persuasion est utilisé ?",["Social proof|La preuve sociale","Scarcity|La rareté","Reciprocity|La réciprocité","Authority|L'autorité"],0,"We follow what others do. Ask the team directly through a trusted channel.","Nous suivons ce que font les autres. Demandez directement à l'équipe par un canal de confiance."),
Q("A 'recruiter' sends a job offer and asks you to download a skills test from a personal link. What is the risk?","Un « recruteur » envoie une offre d'emploi et vous demande de télécharger un test de compétences depuis un lien personnel. Quel est le risque ?",["None, recruiters are trusted|Aucun, les recruteurs sont dignes de confiance","The file may carry malware, and the offer may be a pretext|Le fichier peut contenir un logiciel malveillant, et l'offre peut être un prétexte","The test will be too hard|Le test sera trop difficile","Your CV becomes public|Votre CV devient public"],1,"Fake job offers are a common route to malware. Verify the company and recruiter on official sites first.","Les fausses offres d'emploi sont une voie fréquente vers les logiciels malveillants. Vérifiez d'abord l'entreprise et le recruteur sur des sites officiels."),
/* Good practices */
Q("Which second factor is generally the strongest against phishing?","Quel second facteur résiste généralement le mieux au phishing ?",["SMS code|Code par SMS","Security key (FIDO2)|Clé de sécurité (FIDO2)","Security question|Question secrète","Email code|Code par e-mail"],1,"Security keys only answer the real website, so a fake page cannot reuse them. SMS and email codes can be handed over.","Les clés de sécurité ne répondent qu'au vrai site, une fausse page ne peut donc pas les réutiliser. Les codes SMS et e-mail peuvent être livrés à un attaquant."),
Q("Why use a different password for each account?","Pourquoi utiliser un mot de passe différent pour chaque compte ?",["To make logins slower|Pour ralentir les connexions","So one breach does not unlock your other accounts|Pour qu'une fuite ne donne pas accès à vos autres comptes","Because the law requires it|Parce que la loi l'exige","To avoid using MFA|Pour éviter l'authentification multifacteur"],1,"Attackers try stolen passwords on other sites. Unique passwords stop one leak from spreading.","Les attaquants testent les mots de passe volés sur d'autres sites. Des mots de passe uniques empêchent une fuite de se propager."),
Q("What makes a strong passphrase?","Qu'est-ce qui fait une bonne phrase de passe ?",["Your birthday and pet's name|Votre date de naissance et le nom de votre animal","Several random words, long and unique|Plusieurs mots aléatoires, longue et unique","The word 'password' with a 1 at the end|Le mot « motdepasse » suivi d'un 1","Your phone number|Votre numéro de téléphone"],1,"Length and randomness matter most. A password manager can create and store it for you.","La longueur et le hasard comptent le plus. Un gestionnaire de mots de passe peut la créer et la stocker."),
Q("When should you share your MFA code with support staff?","Quand devez-vous partager votre code MFA avec le personnel de support ?",["Whenever they ask|Chaque fois qu'ils le demandent","Never|Jamais","Only by phone|Seulement par téléphone","Only if they know your name|Seulement s'ils connaissent votre nom"],1,"Codes are for you alone. Anyone asking for one is trying to log in as you.","Les codes sont pour vous seul. Quiconque en demande un essaie de se connecter à votre place."),
Q("Before entering card details on an unknown shopping site, what is the wisest step?","Avant de saisir vos données de carte sur un site marchand inconnu, quelle est l'étape la plus sage ?",["Check only for a padlock|Vérifier uniquement la présence du cadenas","Look for independent reviews and a verifiable business, and prefer payment with buyer protection|Chercher des avis indépendants et une entreprise vérifiable, et privilégier un paiement avec protection de l'acheteur","Trust the low price|Se fier au prix bas","Enter details to see the final price|Saisir ses données pour voir le prix final"],1,"Fake shops copy real ones and use bargain prices as bait. Independent checks beat appearances.","Les faux sites marchands copient les vrais et utilisent des prix cassés comme appât. Les vérifications indépendantes valent mieux que les apparences."),
Q("Why keep your phone and browser updated?","Pourquoi garder votre téléphone et votre navigateur à jour ?",["To get new emojis|Pour avoir de nouveaux émojis","Updates fix security holes that malicious pages and files exploit|Les mises à jour corrigent des failles exploitées par des pages et fichiers malveillants","It uses less data|Cela consomme moins de données","It blocks all phishing|Cela bloque tout le phishing"],1,"Updates close known holes, but they do not replace your own vigilance.","Les mises à jour comblent des failles connues, mais ne remplacent pas votre propre vigilance."),
Q("Which habit is wisest for sensitive logins on public Wi-Fi in a café?","Quelle habitude est la plus sage pour des connexions sensibles sur le Wi-Fi public d'un café ?",["Use it freely, https protects everything|L'utiliser librement, https protège tout","Avoid sensitive logins on it, or use a trusted VPN or mobile data|Éviter les connexions sensibles dessus, ou utiliser un VPN de confiance ou les données mobiles","Share the Wi-Fi password with others|Partager le mot de passe du Wi-Fi","Turn off your screen|Éteindre votre écran"],1,"Fake hotspots and fake login pages are easier to set up on open networks. Mobile data is safer.","Les faux points d'accès et les fausses pages de connexion sont plus faciles à mettre en place sur des réseaux ouverts. Les données mobiles sont plus sûres."),
Q("What is the benefit of using a 'report phishing' button or channel?","Quel est l'intérêt d'un bouton ou canal « signaler un phishing » ?",["It deletes the email for everyone automatically|Il supprime automatiquement l'e-mail pour tout le monde","It lets security block the attack and warn others quickly|Il permet à l'équipe sécurité de bloquer l'attaque et d'avertir les autres rapidement","It punishes the sender|Il punit l'expéditeur","It slows down email|Il ralentit la messagerie"],1,"One report can protect the whole organization. Fast reporting is a strength, not an admission of failure.","Un signalement peut protéger toute l'organisation. Signaler vite est une force, pas un aveu d'échec."),
/* Incident response */
Q("You opened a suspicious attachment and nothing visible happened. What next?","Vous avez ouvert une pièce jointe suspecte et rien de visible ne s'est passé. Et maintenant ?",["Nothing, no visible effect|Rien, aucun effet visible","Disconnect from the network if advised, and report to IT immediately|Vous déconnecter du réseau si on vous le conseille et signaler immédiatement à l'informatique","Delete the file and stay quiet|Supprimer le fichier et ne rien dire","Restart and keep working|Redémarrer et continuer à travailler"],1,"Malware is often silent. Early reporting limits the damage.","Un logiciel malveillant est souvent silencieux. Un signalement précoce limite les dégâts."),
Q("You typed your password on a fake page and reuse it on other accounts. What do you do?","Vous avez saisi votre mot de passe sur une fausse page et vous le réutilisez sur d'autres comptes. Que faites-vous ?",["Change it on every account where you reused it|Le changer sur tous les comptes où vous l'avez réutilisé","Change only the email password|Ne changer que le mot de passe de la messagerie","Wait a week|Attendre une semaine","Delete the fake page's email|Supprimer l'e-mail de la fausse page"],0,"Attackers try the stolen password everywhere. Change each reused one, preferably with MFA on.","Les attaquants essaient le mot de passe volé partout. Changez chaque compte concerné, de préférence en activant la MFA."),
Q("You sent money to a fraudster. How fast should you contact your bank?","Vous avez envoyé de l'argent à un fraudeur. Dans quel délai contacter votre banque ?",["As soon as possible, because early reports can sometimes stop transfers|Dès que possible, car un signalement rapide peut parfois bloquer le virement","After a month|Après un mois","Only if they contact you|Seulement s'ils vous contactent","Never, it is hopeless|Jamais, c'est sans espoir"],0,"Minutes and hours matter. Banks and operators can sometimes freeze or recall payments if told quickly.","Les minutes et les heures comptent. Les banques et opérateurs peuvent parfois bloquer ou rappeler un paiement s'ils sont prévenus vite."),
Q("Why report a phishing attempt even if you did not click?","Pourquoi signaler une tentative de phishing même si vous n'avez pas cliqué ?",["It is a legal requirement for everyone|C'est une obligation légale pour tous","Others may have received it, and security can block the sender|D'autres l'ont peut-être reçu et la sécurité peut bloquer l'expéditeur","It earns a prize|Cela fait gagner un prix","It deletes your inbox|Cela vide votre boîte de réception"],1,"The same message usually reaches many people. Your report protects the ones who might click.","Le même message atteint généralement beaucoup de monde. Votre signalement protège ceux qui pourraient cliquer."),
Q("After a suspected account compromise, what should you check in your email settings?","Après une suspicion de compromission, que vérifier dans les paramètres de votre messagerie ?",["Forwarding rules and recent sign-in activity|Les règles de redirection et l'activité de connexion récente","The font size|La taille de la police","The signature colour|La couleur de la signature","The inbox sort order|L'ordre de tri de la boîte"],0,"Attackers often add hidden forwarding rules to keep reading your mail after you change your password.","Les attaquants ajoutent souvent des règles de redirection cachées pour continuer à lire vos e-mails après un changement de mot de passe."),
/* Work and payments */
Q("The 'CEO' emails the finance team: 'Urgent confidential transfer, tell nobody.' Which control helps most?","Le « PDG » écrit à l'équipe finance : « Virement urgent et confidentiel, n'en parlez à personne. » Quel contrôle aide le plus ?",["Pay quickly to impress|Payer vite pour faire bonne impression","A second person's approval and a call-back on a known number|L'approbation d'une seconde personne et un rappel sur un numéro connu","Reply asking for more details|Répondre pour demander plus de détails","Keep it secret as requested|Garder le secret comme demandé"],1,"Secrecy plus urgency is a red flag. Dual approval and out-of-band confirmation break the scam.","Secret et urgence forment un signal d'alerte. La double approbation et la confirmation par un autre canal font échouer l'arnaque."),
Q("A vendor writes that their bank account has changed and attaches a new letterhead. What should you do?","Un fournisseur écrit que son compte bancaire a changé et joint un nouvel en-tête. Que faire ?",["Update the records, the letterhead looks right|Mettre à jour les données, l'en-tête semble correct","Confirm by phoning the vendor on a number you already hold before changing anything|Confirmer par téléphone auprès du fournisseur, sur un numéro que vous avez déjà, avant tout changement","Ask them to resend the email|Leur demander de renvoyer l'e-mail","Pay half to the new account|Payer la moitié sur le nouveau compte"],1,"Letterheads are easy to copy. A call on a trusted number is the check that works.","Les en-têtes se copient facilement. Un appel sur un numéro de confiance est la vérification qui fonctionne."),
Q("Why can sharing your job role and tools publicly be a phishing risk?","Pourquoi partager publiquement votre poste et vos outils peut-il être un risque de phishing ?",["It is not a risk|Ce n'est pas un risque","Attackers use it to craft convincing targeted messages|Les attaquants s'en servent pour fabriquer des messages ciblés convaincants","It slows down your computer|Cela ralentit votre ordinateur","It changes your password|Cela modifie votre mot de passe"],1,"Public details help attackers write messages that sound right. Share with care.","Les détails publics aident les attaquants à écrire des messages crédibles. Partagez avec discernement."),
Q("A colleague's email account suddenly sends odd links to everyone. What is likely?","Le compte e-mail d'un collègue envoie soudain des liens étranges à tout le monde. Que se passe-t-il probablement ?",["The colleague wants to share news|Le collègue veut partager une nouvelle","The account may be compromised: alert IT and do not click|Le compte est peut-être compromis : alertez l'informatique et ne cliquez pas","A software bug that fixes itself|Un bogue qui se corrige tout seul","A friendly test|Un test amical"],1,"Hijacked accounts are used to phish contacts, who trust the sender. Warn the colleague by another channel too.","Les comptes piratés servent à hameçonner les contacts, qui font confiance à l'expéditeur. Prévenez aussi le collègue par un autre canal."),
Q("Which policy best protects against fake payment requests at work?","Quelle règle protège le mieux contre les fausses demandes de paiement au travail ?",["Verbal approval only|Une approbation orale seulement","Documented dual approval and out-of-band verification|Une double approbation documentée et une vérification par un autre canal","Approval by whoever shouts loudest|L'approbation par celui qui crie le plus fort","Skipping approvals when busy|Sauter les approbations quand on est occupé"],1,"Process beats persuasion. A clear rule protects staff from pressure.","Le processus l'emporte sur la persuasion. Une règle claire protège le personnel de la pression."),
/* QR, mobile, documents */
Q("A QR sticker has been placed over the real one on a parking payment machine. What is the risk?","Un autocollant QR a été collé sur le vrai code d'un horodateur. Quel est le risque ?",["None|Aucun","Quishing: it may lead to a fake payment page|Le quishing : il peut mener vers une fausse page de paiement","A slower payment|Un paiement plus lent","Free parking|Un stationnement gratuit"],1,"Anyone can print a QR code. Check the address it opens and pay in the official app when you can.","N'importe qui peut imprimer un QR code. Vérifiez l'adresse qui s'ouvre et payez dans l'appli officielle si possible."),
Q("An app from outside the official store asks to read your SMS. What is a sensible response?","Une appli hors de la boutique officielle demande à lire vos SMS. Quelle réponse est raisonnable ?",["Allow it, apps need SMS|L'autoriser, les applis ont besoin des SMS","Do not install apps from unofficial sources, and avoid granting SMS access without need|Ne pas installer d'applis hors des boutiques officielles et éviter d'accorder l'accès aux SMS sans nécessité","Allow it to see the news|L'autoriser pour voir l'actualité","Install it twice|L'installer deux fois"],1,"SMS access lets malware read one-time codes. Stick to official stores and minimal permissions.","L'accès aux SMS permet à un logiciel malveillant de lire vos codes à usage unique. Restez sur les boutiques officielles et des permissions minimales."),
Q("A document says 'Enable macros to view content'. What should you do?","Un document dit « Activez les macros pour afficher le contenu ». Que faire ?",["Enable them|Les activer","Do not enable them unless you trust the source and expected the file|Ne pas les activer sauf si vous faites confiance à la source et attendiez le fichier","Enable them, then run antivirus|Les activer, puis lancer un antivirus","Print the document|Imprimer le document"],1,"Macros are a classic way to run malware. A genuine document rarely needs them just to be read.","Les macros sont un moyen classique d'exécuter un logiciel malveillant. Un vrai document en a rarement besoin pour être lu."),
Q("A friend's message with a link feels out of character. What is a good habit?","Le message d'un ami avec un lien vous semble inhabituel. Quelle bonne habitude adopter ?",["Click, they are friends|Cliquer, ce sont des amis","Ask them through another channel whether they really sent it|Leur demander par un autre canal s'ils l'ont vraiment envoyé","Share it onward|Le partager à d'autres","Reply 'thanks'|Répondre « merci »"],1,"Hijacked accounts message contacts. A quick call settles it and warns your friend.","Les comptes piratés écrivent à leurs contacts. Un appel rapide règle la question et prévient votre ami.")
];

/* ============ state ============ */
var done={intro:false,email:false,sites:false,tactics:false,habits:false,cases:false,quiz:false};
var MODS=[["intro","mod1","n_intro","#intro"],["email","mod2","n_email","#email"],["sites","mod3","n_sites","#sites"],["tactics","mod4","n_tactics","#tactics"],["habits","mod5","n_habits","#habits"],["cases","mod6","n_cases","#cases"],["quiz","mod7","n_quiz","#quiz"]];
var found={},urlAns={},ticked={};
var PASS_MARK=6; /* minimum Mindset Quiz score (out of 10) that validates module 7 */
var URL_PASS_MARK=4; /* minimum score (out of 6) to validate module 3 */
var mq={order:[],perms:[],qi:0,score:0,miss:[],picked:null};
var pg={phase:"idle",pool:[],round:1,ids:[],perms:{},qi:0,score:0,total:0,miss:[],picked:null,rounds:0};

function progress(){
  var n=0;MODS.forEach(function(m){if(done[m[0]])n++});
  var p=Math.round(n/MODS.length*100);$("#pct").textContent=p+"%";$("#fill").style.width=p+"%";
  $("#pc-list").innerHTML=MODS.map(function(m){
    return '<li class="'+(done[m[0]]?"ok":"")+'"><span aria-hidden="true">'+(done[m[0]]?"✓":"○")+'</span><a href="'+m[3]+'">'+esc(tr(m[1]))+' · '+esc(tr(m[2]))+'</a></li>';
  }).join("");
  document.querySelectorAll("#pc-list a").forEach(function(a){a.addEventListener("click",function(e){e.preventDefault();var t=$(a.getAttribute("href"));if(t)t.scrollIntoView({behavior:"smooth",block:"start"})})});
}
function renderDone(){
  document.querySelectorAll(".done-btn").forEach(function(b){var on=done[b.dataset.k];b.classList.toggle("on",on);b.setAttribute("aria-pressed",on?"true":"false");b.textContent=on?tr("done_on"):tr("done_off")});
}
document.querySelectorAll(".done-btn").forEach(function(b){b.addEventListener("click",function(){done[b.dataset.k]=!done[b.dataset.k];renderDone();progress()})});

/* ============ renderers ============ */
function renderTypes(){
  $("#types").innerHTML=TYPES.map(function(x){var i=ix();return '<div><b>'+esc(x[i])+'</b>'+esc(x[2+i])+'</div>'}).join("");
}
function renderFlags(){
  var i=ix(),keys=Object.keys(found).map(Number).sort(function(a,b){return a-b});
  $("#flags").innerHTML=keys.map(function(k){return '<div class="flag"><b>'+esc(FLAGS[k][i])+'</b><span>'+esc(FLAGS[k][2+i])+'</span></div>'}).join("");
  $("#fcount").textContent=fmt(tr("e_found"),{n:keys.length});
  document.querySelectorAll(".hs").forEach(function(b){b.classList.toggle("found",found[b.dataset.f]===true)});
  if(keys.length===7&&!done.email){done.email=true;progress()}
}
function renderUrlGame(){
  var i=ix();
  $("#urlgame").innerHTML=URLS.map(function(u,n){
    var a=urlAns[n],has=a!==undefined,ok=has&&a===u[1];
    return '<div class="g-row'+(has?(ok?" ok":" no"):"")+'"><span class="u">'+esc(u[0])+'</span><div class="choice"><button data-n="'+n+'" data-a="1"'+(has?" disabled":"")+'>'+esc(tr("s_real"))+'</button><button data-n="'+n+'" data-a="0"'+(has?" disabled":"")+'>'+esc(tr("s_fake"))+'</button></div>'+
      (has?'<p class="why">'+esc(ok?tr("s_ok"):tr("s_no"))+esc(u[2+i])+'</p>':'')+'</div>';
  }).join("");
  document.querySelectorAll("#urlgame button").forEach(function(b){b.addEventListener("click",function(){
    urlAns[+b.dataset.n]=(b.dataset.a==="1");renderUrlGame();
  })});
  var answered=Object.keys(urlAns).length;
  var result=$("#urlresult");
  if(answered===URLS.length){
    var score=URLS.reduce(function(sum,u,n){return sum+(urlAns[n]===u[1]?1:0)},0),passed=score>=URL_PASS_MARK;
    result.innerHTML='<div class="score"><span class="label">'+esc(tr("q_res"))+'</span><span class="big">'+score+' / '+URLS.length+'</span><p class="'+(passed?"okbox":"note")+'">'+esc(passed?tr("s_pass"):tr("s_fail"))+'</p>'+(passed?'':'<div class="tools"><button class="btn alt" id="urlretry">'+esc(tr("s_retry"))+'</button></div>')+'</div>';
    if(passed&&!done.sites){done.sites=true;progress()}
    if(!passed){$("#urlretry").addEventListener("click",function(){urlAns={};done.sites=false;result.innerHTML="";renderUrlGame();progress()})}
  }else{result.innerHTML="";}
}
function renderTactics(){
  var i=ix();
  $("#tactics-grid").innerHTML=TAC.map(function(t){
    var ex=i===0?"“"+t[4]+"”":"« "+t[5]+" »";
    return '<div class="card tac"><h3><span>'+esc(t[i])+'</span><span class="pill">'+esc(t[2+i])+'</span></h3><q>'+esc(ex)+'</q><p>'+esc(tr("t_why"))+' '+esc(t[6+i])+'</p><p class="fix"><b>'+esc(tr("t_fix"))+'</b> '+esc(t[8+i])+'</p></div>';
  }).join("");
}
function renderHabits(){
  var i=ix();
  $("#check").innerHTML=HAB.map(function(h,n){
    return '<li><label class="'+(ticked[n]?"on":"")+'"><input type="checkbox" data-n="'+n+'"'+(ticked[n]?" checked":"")+'><span><b>'+esc(h[2*i])+'</b><small>'+esc(h[2*i+1])+'</small></span></label></li>';
  }).join("");
  updateHabitCount();
  document.querySelectorAll("#check input").forEach(function(c){c.addEventListener("change",function(){
    ticked[c.dataset.n]=c.checked;c.closest("label").classList.toggle("on",c.checked);
    updateHabitCount();done.habits=(countTicks()===HAB.length);progress();
  })});
}
function countTicks(){return HAB.filter(function(_,n){return ticked[n]}).length}
function updateHabitCount(){$("#hcount").textContent=fmt(tr("b_count"),{n:countTicks(),m:HAB.length})}
function renderCases(){
  var i=ix();
  $("#cases-grid").innerHTML=CASES.map(function(c){
    return '<div class="card case"><span class="yr">'+esc(c[0])+'</span><h3>'+esc(c[1+i])+'</h3><p style="font-size:.92rem;color:var(--muted)">'+esc(c[3+i])+'</p><p class="lesson"><b>'+esc(tr("c_lesson"))+'</b> '+esc(c[5+i])+'</p></div>';
  }).join("");
}

/* generic question card html */
function qHTML(q,perm,picked){
  var i=ix();
  var h='<p class="q-prompt">'+esc(q.q[i])+'</p><div class="opts">';
  perm.forEach(function(orig,p){
    var cls="opt";
    if(picked!==null){if(orig===q.a)cls+=" right";else if(p===picked)cls+=" wrong"}
    h+='<button class="'+cls+'" data-p="'+p+'"'+(picked!==null?" disabled":"")+'>'+esc(q.o[orig][i])+'</button>';
  });
  h+='</div>';
  if(picked!==null){
    var ok=perm[picked]===q.a;
    h+='<div class="expl"><b>'+esc(ok?tr("q_ok"):tr("q_no"))+'</b>'+esc(q.e[i])+'</div>';
  }
  return h;
}

/* ---- Mindset Quiz ---- */
function startMQ(){
  mq.perms=MQ.map(function(){return [0,1,2,3]});
  mq.qi=0;mq.score=0;mq.miss=[];mq.picked=null;renderMQ();
}
function renderMQ(){
  var box=$("#quizbox"),i=ix(),n=MQ.length;
  if(mq.qi>=n){
    var passed=mq.score>=PASS_MARK;var v=mq.score>=8?tr("q_v1"):passed?tr("q_v2"):tr("q_v3");
    box.innerHTML='<div class="score"><span class="label">'+esc(tr("q_res"))+'</span><span class="big">'+mq.score+' / '+n+'</span><p>'+esc(v)+'</p><p class="'+(passed?"okbox":"note")+'">'+esc(passed?tr("q_pass"):tr("q_fail"))+'</p>'+
      (mq.miss.length?'<h3>'+esc(tr("q_rev"))+'</h3><ul class="review">'+mq.miss.map(function(k){return '<li><span class="pill bad">'+esc(tr("q_miss"))+'</span><span>'+esc(MQ[k].e[i])+'</span></li>'}).join("")+'</ul>':'<p>'+esc(tr("q_perfect"))+'</p>')+
      '<p style="color:var(--muted)">'+esc(tr("q_more"))+'</p><div class="tools"><button class="btn primary" id="toGame">'+esc(tr("q_goto"))+'</button><button class="btn alt" id="retry">'+esc(tr("q_retry"))+'</button></div></div>';
    $("#retry").addEventListener("click",startMQ);
    $("#toGame").addEventListener("click",function(){$("#phishgame").scrollIntoView({behavior:"smooth",block:"start"})});
    if(passed&&!done.quiz){done.quiz=true;progress()}
    return;
  }
  var q=MQ[mq.qi],perm=mq.perms[mq.qi];
  box.innerHTML='<div class="qh"><span class="label">'+esc(fmt(tr("q_qn"),{i:mq.qi+1,n:n}))+'</span><span class="mono">'+esc(fmt(tr("q_score"),{s:mq.score}))+'</span></div><div style="margin-top:10px">'+qHTML(q,perm,mq.picked)+'</div>'+
    (mq.picked!==null?'<div class="tools" style="margin-top:14px"><button class="btn" id="next">'+esc(mq.qi===n-1?tr("q_see"):tr("q_next"))+'</button></div>':'');
  if(mq.picked===null){
    box.querySelectorAll(".opt").forEach(function(b){b.addEventListener("click",function(){
      var p=+b.dataset.p;mq.picked=p;
      if(perm[p]===q.a)mq.score++;else mq.miss.push(mq.qi);
      renderMQ();var nx=$("#next");if(nx)nx.focus();
    })});
  }else{
    $("#next").addEventListener("click",function(){mq.qi++;mq.picked=null;renderMQ()});
  }
}

/* ---- PhishGame ---- */
function pgStartSession(){
  pg.pool=shuffle(GQ.map(function(_,k){return k}));
  pg.round=1;pg.total=0;pg.rounds=0;pgStartRound();
}
function pgStartRound(){
  pg.ids=pg.pool.slice((pg.round-1)*10,pg.round*10);
  pg.perms={};pg.ids.forEach(function(id){pg.perms[id]=shuffle([0,1,2,3])});
  pg.qi=0;pg.score=0;pg.miss=[];pg.picked=null;pg.phase="play";renderPG();
}
function pips(){
  var h='<div class="pips">';
  for(var r=1;r<=5;r++){
    var cls="pip";
    if(pg.phase==="win"||r<pg.round||(r===pg.round&&(pg.phase==="roundEnd")))cls+=" ok";
    else if(r===pg.round&&pg.phase==="play")cls+=" cur";
    h+='<span class="'+cls+'">'+r+'</span>';
  }
  return h+'</div>';
}
function missList(){
  var i=ix();
  if(!pg.miss.length)return "";
  return '<h3>'+esc(tr("g_review"))+'</h3><ul class="review">'+pg.miss.map(function(id){return '<li><span class="pill bad">'+esc(tr("q_miss"))+'</span><span>'+esc(GQ[id].e[i])+'</span></li>'}).join("")+'</ul>';
}
function renderPG(){
  var box=$("#pgbox"),i=ix();
  if(pg.phase==="idle"){
    box.innerHTML='<div class="score"><ul class="rules"><li>'+esc(tr("g_r1"))+'</li><li>'+esc(tr("g_r2"))+'</li><li>'+esc(tr("g_r3"))+'</li><li>'+esc(tr("g_r4"))+'</li></ul><div class="tools"><button class="btn primary" id="play">'+esc(tr("g_play"))+'</button></div></div>';
    $("#play").addEventListener("click",pgStartSession);return;
  }
  if(pg.phase==="play"){
    var id=pg.ids[pg.qi],q=GQ[id],perm=pg.perms[id];
    box.innerHTML='<div class="qh">'+pips()+'<span class="mono">'+esc(fmt(tr("g_rs"),{s:pg.score}))+' · '+esc(fmt(tr("g_tot"),{t:pg.total+pg.score}))+'</span></div>'+
      '<div class="qh" style="margin-top:12px"><span class="label">'+esc(fmt(tr("g_round"),{r:pg.round}))+' · '+esc(fmt(tr("g_q"),{i:pg.qi+1}))+'</span></div><div style="margin-top:10px">'+qHTML(q,perm,pg.picked)+'</div>'+
      (pg.picked!==null?'<div class="tools" style="margin-top:14px"><button class="btn" id="pnext">'+esc(pg.qi===9?tr("q_see"):tr("q_next"))+'</button></div>':'');
    if(pg.picked===null){
      box.querySelectorAll(".opt").forEach(function(b){b.addEventListener("click",function(){
        var p=+b.dataset.p;pg.picked=p;
        if(perm[p]===q.a)pg.score++;else pg.miss.push(id);
        renderPG();var nx=$("#pnext");if(nx)nx.focus();
      })});
    }else{
      $("#pnext").addEventListener("click",function(){
        pg.qi++;pg.picked=null;
        if(pg.qi<10){renderPG();return}
        pg.total+=pg.score;pg.rounds++;
        if(pg.score>5){pg.phase=pg.round===5?"win":"roundEnd"}else{pg.phase="over"}
        renderPG();
      });
    }
    return;
  }
  var head='<div class="score">'+pips();
  if(pg.phase==="roundEnd"){
    box.innerHTML=head+'<span class="label">'+esc(fmt(tr("g_done"),{r:pg.round,s:pg.score}))+'</span><span class="big">'+pg.score+' / 10</span><p>'+esc(fmt(tr("g_unlock"),{n:pg.round+1}))+' · '+esc(fmt(tr("g_tot"),{t:pg.total}))+'</p>'+missList()+'<div class="tools"><button class="btn primary" id="nround">'+esc(fmt(tr("g_start"),{n:pg.round+1}))+'</button></div></div>';
    $("#nround").addEventListener("click",function(){pg.round++;pgStartRound()});
  }else if(pg.phase==="over"){
    box.innerHTML=head+'<span class="label">'+esc(fmt(tr("g_done"),{r:pg.round,s:pg.score}))+'</span><span class="big">'+pg.score+' / 10</span><p>'+esc(fmt(tr("g_over"),{t:pg.total,k:pg.rounds}))+'</p>'+missList()+'<div class="tools"><button class="btn primary" id="again">'+esc(tr("g_new"))+'</button></div></div>';
    $("#again").addEventListener("click",pgStartSession);
  }else if(pg.phase==="win"){
    box.innerHTML=head+'<span class="label">'+esc(tr("g_win_h"))+'</span><span class="big">'+pg.total+' / 50</span><p>'+esc(fmt(tr("g_win"),{t:pg.total}))+'</p>'+missList()+'<div class="tools"><button class="btn primary" id="again">'+esc(tr("g_again"))+'</button></div></div>';
    $("#again").addEventListener("click",pgStartSession);
  }
}

/* ============ language ============ */
function renderAll(){
  applyStatic();renderTypes();renderFlags();renderUrlGame();renderTactics();renderHabits();renderCases();renderMQ();renderPG();renderDone();progress();
}
function setLang(l){
  L=l;try{localStorage.setItem("spf-lang",l)}catch(e){}
  document.documentElement.lang=l;
  document.querySelectorAll(".lang button").forEach(function(b){b.setAttribute("aria-pressed",b.dataset.l===l?"true":"false")});
  renderAll();
}
document.querySelectorAll(".lang button").forEach(function(b){b.addEventListener("click",function(){setLang(b.dataset.l)})});
document.querySelectorAll(".bar a[href^='#']").forEach(function(a){
  a.addEventListener("click",function(e){e.preventDefault();var t=$(a.getAttribute("href"));if(t)t.scrollIntoView({behavior:"smooth",block:"start"})});
});
document.querySelectorAll(".hs").forEach(function(b){b.addEventListener("click",function(){found[b.dataset.f]=true;renderFlags()})});
$("#revealAll").addEventListener("click",function(){FLAGS.forEach(function(_,k){found[k]=true});renderFlags()});

mq.perms=MQ.map(function(){return [0,1,2,3]});
setLang(L);progress();
})();
</script>
